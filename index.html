<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Beyond the Manhattan Project</title>

	<!-- Leaflet CSS and JS -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.css" integrity="sha256-RwBOaSN3kFqUIUAZaMmmo5grrEMRXwBCe0sCRJgqydk=" crossorigin="anonymous">
	<script type="importmap">
		{"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.js"},"integrity": {"https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.js": "sha256-KSSQ64wnHC2i4zVNU79jUjWmdKCIJjLj/gkifFEluvo="}}
	</script>
	
	<!-- Bootstrap CSS -->
	 <!-- ENTER HERE -->

	<style>
		/* make map take up whole page */
		html, body{
			margin: 0;
			padding: 0;
			height: 100%;
			width: 100%;
		}
		/* header styling */
	</style>
</head>

<body>
	<header>Beyond the Manhattan Project: Mapping the Expansion of America’s Nuclear Complex, from the Manhattan Project to the Cold War</header>
	
	<!--map-->
	<div id="map" style="height: 100%; width: 100%;"></div>
	
	<!-- imports from leaflet-->
	<script type="module">
		import {LeafletMap, TileLayer, Marker, Icon, Circle, Polygon} from 'leaflet';
        
    // initializing map to the center of the US
        const map = new LeafletMap('map').setView([40.3,-96.6], 5);
		
    // the map code for the tile layer
        new TileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.{ext}', {
	        maxZoom: 19,
	        attribution: '&copy; <a href="https://www.stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
	        ext: 'png'}).addTo(map);

	// creating a dataset for the map - longitude, latitude for coordinates
		const dataset = [
			//Los Alamos, New Mexico
			{
				type: 'Feature',
				geometry: {type: 'Point', coordinates: [-106.32, 35.87]},
				properties: {
					title: 'Los Alamos, New Mexico',
					description: 'During World War II, Los Alamos, New Mexico was transformed into "Site Y," a top-secret wartime laboratory and closed city dedicated to designing and building the world\'s first atomic weapons dropped in Trinity Site, New Mexico and Nagasaki and Hiroshima, Japan.',
					year: 1943,
					read: 'https://www.nps.gov/mapr/los-alamos.htm',
					image: 'images/losalamos.jpg',
					alt: 'Black-and-white historical photograph showing Los Alamos Project Main Gate, a guarded entrance during Manhattan Project era. Small gatehouse displays sign reading “Passes Must Be Presented to Guards,” with parked vintage car, utility poles, fencing, and “Post No. 1” label.',
					figcaption: '<a href="https://commons.wikimedia.org/wiki/File:Los_Alamos_Main_Gate_(2).jpg">United States Army</a>, Public domain, via Wikimedia Commons',
					icon: { 
						iconUrl: 'images/radiation.png', 
						iconSize: [32, 32], 
						iconAnchor: [16, 16], 
						popupAnchor: [0, -16]
					}
				}
			},
			//Oak Ridge, Tennessee
			{
				type: 'Feature',
				geometry: {type: 'Point', coordinates: [-84.25283, 35.98633]},
				properties: {
					title: 'Oak Ridge, Tennessee',
					description: 'During World War II, Oak Ridge, Tennessee was transformed into  the Y-12 Electromagnetic Separation Plant to enrich uranium-235 (known as "product 25") for atomic weapons using electromechanical devices called calutrons. The site produced the enriched uranium, which was then securely shipped from Tennessee to Site Y in New Mexico so scientists could assemble it into the core of the "Little Boy" bomb dropped on Hiroshima. At its World War II peak, the facility employed roughly 22,000 workers, notably young women operators known as the "Calutron Girls".',
					year: 1943,
					read: 'https://www.nps.gov/places/oak-ridge-tennessee.htm',
					image: 'images/calutrongirls.jpg',
					alt: 'Black-and-white historical photograph showing women operating equipment inside a large industrial control room. Rows of numbered electrical panels, switches, gauges, stools, overhead lights, and repeated operators emphasize scale and coordinated manual monitoring.',
					figcaption: '<a href="https://commons.wikimedia.org/wiki/File:Y12_Calutron_Operators.jpg">Ed Westcott / US Army / Manhattan Engineering District</a>, Public domain, via Wikimedia Commons',
					icon: { 
						iconUrl: 'images/radiation.png', 
						iconSize: [32, 32], 
						iconAnchor: [16, 16], 
						popupAnchor: [0, -16]
					}
				}
			},
			// Hanford, Washington
			{
				type: 'Feature',
				geometry: {type: 'Point', coordinates: [-119.300420, 46.318555]},
				properties: {
					title: 'Hanford, Washington',
					description: 'During World War II, Hanford Site was established along the Columbia River in southeastern Washington State as one of the three top-secret facilities. It was given the code name Site W. It produced plutonium for the Trinity test and the Fat Man bomb dropped on Nagasaki. It is recognized as the Western Hemisphere\'s most contaminated nuclear site, currently undergoing a massive, decades-long cleanup overseen jointly by federal and state agencies under the Tri-Party Agreement.',
					year: 1943,
					read: 'https://www.nps.gov/mapr/about-hanford.htm',
					image: 'images/hanford.jpg',
					alt: 'Aerial black-and-white photograph shows an industrial power or processing facility beside a wide river, surrounded by barren, heavily tracked terrain. Buildings, roads, parking areas, tall smokestack, cooling structures, and distant steam plume highlight large-scale industrial activity.',
					figcaption: '<a href="https://commons.wikimedia.org/wiki/File:Hanford_N_Reactor_adjusted.jpg">United States Department of Energy</a>, Public domain, via Wikimedia Commons',
					icon: { 
						iconUrl: 'images/radiation.png', 
						iconSize: [32, 32], 
						iconAnchor: [16, 16], 
						popupAnchor: [0, -16]
					}
				}
			},
			// Alamogordo / Trinity Site, New Mexico
			{
				type: 'Feature',
				geometry: {type: 'Point', coordinates: [-106.4753, 33.6772]},
				properties: {
					title: 'Alamogordo / Trinity Site, New Mexico',
					description: 'The atomic bomb was detonated on July 16, 1945 for the first time in history. The US government conducted the trinity test in Alamogordo, New Mexico. Nearly 500,000 civilians lived within a 150-mile radius of the July 16, 1945, Trinity nuclear test site in New Mexico, despite the military\'s claims that the area was isolated.',
					year: 1945,
					read: 'https://www.energy.gov/lm/trinity-site-worlds-first-nuclear-explosion',
					image: 'images/trinity.jpg',
					alt: 'Black-and-white photograph shows a large rounded dust-and-debris dome rising from a flat surface against a dark background. Speckled dome and broad rubble ring suggest a powerful ground-level explosion or impact event.',
					figcaption: '<a href="https://commons.wikimedia.org/wiki/File:Trinity_Test_Fireball_16ms.jpg">Berlyn Brixner / Los Alamos National Laboratory</a>, Public domain, via Wikimedia Commons',
					icon: { 
						iconUrl: 'images/radiation.png', 
						iconSize: [32, 32], 
						iconAnchor: [16, 16], 
						popupAnchor: [0, -16]
					}
				}
			},
		]

	// Create markers from dataset
			const radiationIcon = dataset.map(feature => {
				const [lon, lat] = feature.geometry.coordinates;
				const marker = new Marker([lat, lon], {
					icon: new Icon(feature.properties.icon)
				}).addTo(map);
			
			marker.bindPopup(
				`<div style= "padding: 0px 5px 5px 0px; font-size: large;"><b>${feature.properties.title}</b></div>
				<img src="${feature.properties.image}" alt="${feature.properties.alt}" style="width: 100%; max-width: 250px height: auto;"> 
				<figcaption style='font-size: smaller'>${feature.properties.figcaption}</figcaption> 
				<p>Year: ${feature.properties.year}</p> 
				<p>${feature.properties.description}</p> 
				<a href="${feature.properties.read}" target="_blank">Read more here!</a>`
			);
		
			marker.feature = feature; // Store the feature data in the marker for later use
			return marker;
			});
		</script>

	
</body>
</html>
