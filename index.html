<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.css"
        integrity="sha256-RwBOaSN3kFqUIUAZaMmmo5grrEMRXwBCe0sCRJgqydk=" crossorigin="anonymous">
	<script type="importmap">
		{"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.js"},
         "integrity": {
		"https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.js": "sha256-KSSQ64wnHC2i4zVNU79jUjWmdKCIJjLj/gkifFEluvo="}}
	</script>
	
	<!-- make map take up whole page -->
	<style>
		html, body{
			margin: 0;
			padding: 0;
			height: 100%;
			width: 100%;
		}
	</style>

</head>
<body>
	<div id="map" style="height: 100%; width: 100%;"></div>
	<script type="module">
		import {LeafletMap, TileLayer, Marker, Circle, Polygon} from 'leaflet';
        
        // setting the map view to the center of the US
        const map = new LeafletMap('map').setView([40.3,-96.6], 5);

        // adding markers to the map
        // experimental marker 1: center of the US
        const marker = new Marker([40.3,-96.6]).addTo(map);
            marker.bindPopup("<b>Hello world!</b><br>I am a popup.").openPopup();
        // experimental marker 2: Fresno, CA
        const marker2 = new Marker([36.7477,-119.7724]).addTo(map);
            marker2.bindPopup("<b>Hello world!</b><br>I am a popup.").openPopup();
		
        // the map code for the tile layer
        new TileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.{ext}', {
	        maxZoom: 19,
	        attribution: '&copy; <a href="https://www.stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
	        ext: 'png'}).addTo(map);
	</script>
</body>
</html>
