	// Create markers from dataset
			const radiationIcon = dataset.map(feature => {
				const [lon, lat] = feature.geometry.coordinates;
				const marker = new Marker([lat, lon], {
					icon: new Icon(feature.properties.icon)
				}).addTo(map);
			
			marker.bindPopup(

				<p style='font-family: 'manrope', sans-serif;'>${feature.properties.description}</p> 
				<a href="${feature.properties.read}" style='font-family: 'manrope', sans-serif;' target="_blank">Read more here!</a>`
