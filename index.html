<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Beyond the Manhattan Project</title>

	<!-- Leaflet CSS and JS -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.css" integrity="sha256-RwBOaSN3kFqUIUAZaMmmo5grrEMRXwBCe0sCRJgqydk=" crossorigin="anonymous">
	<script type="importmap">
		{"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.js"},"integrity": {"https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.js": "sha256-KSSQ64wnHC2i4zVNU79jUjWmdKCIJjLj/gkifFEluvo="}}
	</script>
	
	<!-- Bootstrap CSS -->
	 <!-- ENTER HERE -->

	<style>
		/* make map take up whole page */
		html, body{
			margin: 0;
			padding: 0;
			height: 100%;
			width: 100%;
		}
		/* header styling */
	</style>
</head>

<body>
	<header>Beyond the Manhattan Project: Mapping the Expansion of America’s Nuclear Complex, from the Manhattan Project to the Cold War</header>
	
	<!--map-->
	<div id="map" style="height: 100%; width: 100%;"></div>
	
	<!-- imports from leaflet-->
	<script type="module">
		import {LeafletMap, TileLayer, Marker, Icon, Circle, Polygon} from 'leaflet';
        
    // initializing map to the center of the US
        const map = new LeafletMap('map').setView([40.3,-96.6], 5);
		
    // the map code for the tile layer
        new TileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.{ext}', {
	        maxZoom: 19,
	        attribution: '&copy; <a href="https://www.stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
	        ext: 'png'}).addTo(map);

	// creating a dataset for the map - longitude, latitude for coordinates
		const dataset = [
			{
				type: 'Feature',
				geometry: {type: 'Point', coordinates: [-106.32, 35.87]},
				properties: {
					title: 'Los Alamos, New Mexico',
					description: 'During World War II, Los Alamos, New Mexico was transformed into "Site Y," a top-secret wartime laboratory and closed city dedicated to designing and building the world\'s first atomic weapons dropped in Trinity Site, New Mexico and Nagasaki and Hiroshima, Japan.',
					year: 1943,
					read: 'https://www.nps.gov/mapr/los-alamos.htm',
					image: //'images/losalamos.jpg',
					// alt: alternative text accessibility,
					icon: { 
						iconUrl: 'images/radiation.png', 
						iconSize: [32, 32], 
						iconAnchor: [16, 16], 
						popupAnchor: [0, -16]
					}
				}
			}
		]

	// Create markers from dataset
			const radiationIcon = dataset.map(feature => {
				const [lon, lat] = feature.geometry.coordinates;
				const marker = new Marker([lat, lon], {
					icon: new Icon(feature.properties.icon)
				}).addTo(map);
			
			marker.bindPopup(`<b>${feature.properties.title}</b> <img src="${feature.properties.image}" alt="${feature.properties.alt}"> <p>Year: ${feature.properties.year}</p> <p>${feature.properties.description}</p> <a href="${feature.properties.icon.read}" target="_blank">Read more here!</a>`);
		
			marker.feature = feature; // Store the feature data in the marker for later use
			return marker;
			});
		</script>

	
</body>
</html>
